apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}
data:
  APP_ENV: {{ .Values.app.entorno | quote }}
  DB_HOST: {{ .Values.db.host | quote }}
  DB_PORT: {{ .Values.db.port | quote }}
  DB_NAME: {{ .Values.db.name | quote }}
  DB_USER: {{ .Values.db.user | quote }}
  EMPRESA_ID: {{ .Values.app.empresaId | quote }}
  COTIZACIONES_URL: {{ .Values.cotizaciones.url | quote }}
  CONFIAR_PROXY: "1"
